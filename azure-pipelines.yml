trigger:
  - main # Triggers the pipeline when you push to the main branch

variables:
  # The names of the Service Connections you created in Azure DevOps
  dockerRegistryConnection: 'Google-Artifact-Registry'
  k8sConnection: 'Google-GKE-Cluster'
  
  # The path to your Google Artifact Registry repository
  imageRepository: 'prj-ia-tecnoandina/arrows-repo/arrows-ts'
  containerRegistryUrl: 'southamerica-west1-docker.pkg.dev'
  
  # Uses the unique Azure DevOps build ID as the image tag
  tag: '$(Build.BuildId)' 

stages:
- stage: Build
  displayName: Build and Push to Google Artifact Registry
  jobs:
  - job: Build
    displayName: Build Job
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # 1. Build and Push the Docker Image
    - task: Docker@2
      displayName: 'Build and push Docker image'
      inputs:
        containerRegistry: '$(dockerRegistryConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(tag)

- stage: Deploy
  displayName: Release to Google Kubernetes Engine
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy Job
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # 2. Deploy to GKE using your definition YAML
    - task: KubernetesManifest@1
      displayName: 'Deploy to GKE'
      inputs:
        action: 'deploy'
        connectionType: 'kubernetesServiceConnection'
        kubernetesServiceConnection: '$(k8sConnection)'
        namespace: 'default'
        # Point this to wherever your definition file is stored
        manifests: 'k8s.yaml' 
        # This tells Azure to find the generic image name in your k8s.yaml 
        # and swap it out for the exact image we just built!
        containers: '$(containerRegistryUrl)/$(imageRepository):$(tag)'